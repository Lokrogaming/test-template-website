<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Template</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <p class="badge">Test Template · v1.0.0</p>
    <h1>Hallo vom Test Template 👋</h1>
    <p>Wenn du das siehst, funktionieren Download, Entpacken und Preview.</p>
    <button id="btn">Klick mich</button>
    <p id="out"></p>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('out').textContent = 'Button funktioniert! Zeit: ' + new Date().toLocaleTimeString();
    });
  </script>
</body>
</html>
